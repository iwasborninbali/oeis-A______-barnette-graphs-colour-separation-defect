name: Publish Barnette verification data
on:
  push:
    branches:
      - 'chatgpt/2026-11-13-barnette-separation'

permissions:
  contents: write

jobs:
  unpack-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out delivery branch
        uses: actions/checkout@v4
        with:
          ref: 'chatgpt/2026-11-13-barnette-separation'
          persist-credentials: true
      - name: Extract exact submitted files and validate all hashes
        shell: bash
        run: |
          set -euo pipefail
          root='verification/chatgpt/2026-11-13-barnette-separation/result'
          archive="$root/.barnette-upload.zip"
          echo 'c67b9fe33f0de4b35f57742be1dc42f0125cfbb6b673f9a46becb209675e1cb8  '"$archive" | sha256sum -c -
          unzip -oq "$archive" -d .
          rm "$archive"
          test "$(find "$root" -type f | wc -l)" -eq 2872
          ( cd "$root" && sha256sum -c MANIFEST.sha256 > /tmp/barnette-verify.log )
          test "$(grep -c ': OK$' /tmp/barnette-verify.log)" -eq 2871
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$root"
          git commit -m 'Add complete checked Barnette separation results through 52 vertices'
          git push origin HEAD:refs/heads/chatgpt/2026-11-13-barnette-separation
